name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.10.0). Defaults to current ref."
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.10.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      # Resolve what to check out and which immutable tag (if any) to publish
      # alongside :latest. Tag pushes (and explicit workflow_call/dispatch with
      # `inputs.tag`) get both the versioned tag and :latest. Main-branch
      # pushes only get :latest, so the registry's :latest never lags behind
      # main even when release-please is wedged.
      - name: Resolve build context
        id: ctx
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            REF="$INPUT_TAG"
            VERSION="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REF="$GITHUB_REF_NAME"
            VERSION="$GITHUB_REF_NAME"
          else
            REF="$GITHUB_SHA"
            VERSION=""
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/assetlog-${{ matrix.component }}
          # Versioned tag only when we have one; :latest always. The `enable`
          # gate keeps the version line from emitting an empty value on main
          # pushes (docker/metadata-action skips disabled entries).
          tags: |
            type=raw,value=${{ steps.ctx.outputs.version || 'noop' }},enable=${{ steps.ctx.outputs.version != '' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
